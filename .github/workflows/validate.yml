name: Validate dotfiles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python3 scripts/generate-catalog.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n bootstrap.sh && for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/generate-catalog.py --check
      - run: python -m unittest discover -s tests -p test_catalog.py -v
      - shell: powershell
        run: powershell -NoProfile -File tests/windows-tests.ps1
      - shell: pwsh
        run: pwsh -NoProfile -File tests/windows-tests.ps1
